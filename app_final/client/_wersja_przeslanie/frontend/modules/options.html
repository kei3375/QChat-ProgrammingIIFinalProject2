<!--options.html-->

<div class="options-panel">
  <div>
    <div class="op-section-title">connection</div>
    <!-- <div class="op-item" id="options-server" onclick="switch_connection()">
      <span>connecting to <br> the server is <text id="server-color">off</text></span>
    </div> -->
    <div class="op-item" id="options-ip" onclick="editField('ip', this)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span>$$friend ip$$</span>
    </div>
    <div class="op-item" id="options-iport" onclick="editField('iport', this)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>iport:$$iport$$</span>
    </div>
    <div class="op-item" id="options-oport" onclick="editField('oport', this)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>oport:$$oport$$</span>
    </div>
    <div class="op-item" id="options-key" onclick="exchange_keys()">
      <span>exchange keys</span> <span id="key-status">key status: $$key status$$</span>
    </div>
    <!-- nowa sekcja -->
    <div class="op-section-title">coordinating server</div>
    <div>
      <!-- <div class="op-item" id="options-server" onclick="switch_connection()">
        <span>connecting to <br> the server is <text id="server-color">off</text></span>
      </div> -->
      <div class="op-item" id="options-server" onclick="switch_connection()">
        <span>connecting to <br> the server is <text id="server-color">$$server connection$$</text></span>
      </div>
      <div class="op-item" id="options-my-public-ip">
        <span>local IP: <text id="my-public-ip">—</text></span>
      </div>
      <!-- <div class="op-item" id="options-my-local-ip">
        <span>local IP: <text id="my-local-ip">—</text></span>
      </div> -->
      <!-- <div class="op-item" id="options-c-uuid">
        <span>c_uuid: <text id="my-c-uuid">—</text></span>
      </div> -->
    </div>
  </div>

  <div>
    <div class="op-section-title">Friends</div>
    <!-- <div class="op-item" onclick="openAddFriendModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Dodaj znajomego
    </div> -->
    <div class="op-item danger" onclick="removeCurrentFriend()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Remove Friend
    </div>
  </div>
</div>

<!-- Modal dodawania znajomego -->
<div id="add-friend-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; width:340px; display:flex; flex-direction:column; gap:16px;">
    <div style="font-size:0.85rem; font-weight:700; color:var(--text);">Add friend</div>
    <div style="font-size:0.7rem; color:var(--text-muted);">Enter your friend's UUID:</div>
    <input id="add-friend-uuid-input"
      placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      style="background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; color:var(--text); font-family:'Space Mono',monospace; font-size:0.72rem; outline:none; width:100%;"
      oninput="this.style.borderColor = isValidUUID(this.value) ? 'var(--accent)' : 'var(--border)'">
    <div id="add-friend-error" style="font-size:0.65rem; color:#ff4747; display:none;">Nieprawidłowy UUID lub znajomy już istnieje.</div>
    <div style="display:flex; gap:10px;">
      <div class="op-item" style="flex:1; justify-content:center;" onclick="confirmAddFriend()">Confirm</div>
      <div class="op-item danger" style="flex:1; justify-content:center;" onclick="closeAddFriendModal()">Cancel</div>
    </div>
  </div>
</div>
