 <div class="input-bar" id="chat-input">
    <div class="input-wrap">
        <span class="input-prompt">&gt;</span>
        <input type="text" placeholder="WRITE MSG HERE" id="input-text" autofocus>
    </div>

    <!-- ukryty file input -->
    <input type="file" id="file-input" style="display:none" onchange="onFileSelected(this)">

    <!-- podgląd załącznika (domyślnie ukryty) -->
    <div id="attachment-preview" style="display:none; align-items:center; gap:6px; padding: 0 8px; font-size:11px; color:var(--accent); white-space:nowrap; overflow:hidden; max-width:160px;">
        <span id="attachment-name" style="overflow:hidden; text-overflow:ellipsis;"></span>
        <span onclick="clearAttachment()" style="cursor:pointer; opacity:0.6;" title="Usuń">✕</span>
    </div>

    <div class="attach-btn" title="Załącz plik / zdjęcie" onclick="document.getElementById('file-input').click()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
    </div>
    <div class="send-btn" title="Wyślij" onclick="_send_message()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5">
            <path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="M22 2 11 13"/>
        </svg>
    </div>
</div>
