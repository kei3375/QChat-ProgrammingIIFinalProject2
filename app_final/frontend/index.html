<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QChat</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Courier+New:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="icon.ico" type="image/x-icon">

</head>
<body>

$$top bar$$

<div class="app-body">

  <div class="sidebar">
    <div class="sidebar-header">
      friends
      <div class="new-chat-btn" onclick="openAddFriendModal()">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>

    $$friend list$$

    $$settings hidden$$

    <div class="sidebar-footer">
        <div class="my-avatar"></div>
        <div>
            <div class="my-name">$$username$$</div>
            <div class="my-tag">$$uuid$$</div>
        </div>
        <div class="settings-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
    </div>

  </div>

    

  <div class="chat-area">
      
    $$chat header$$

    $$messages$$

    $$input bar$$

  </div>

  $$options$$

</div>

<script>
$$javascript$$
</script>

</body>
</html>
